<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma · 模型与工程标注</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234d7c73'/%3E%3Cpath d='M20 47V17h27v7H28v7h16v7H28v9Z' fill='%23fbfcf8'/%3E%3C/svg%3E">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e6eeeb;color:#283f3c;font-family:system-ui,sans-serif}#canvas{display:block;outline:none;width:100%;height:100%;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#e6eeeb}h1{margin:0;font-size:30px}p{margin:0;color:#647973}progress{width:320px;accent-color:#397e73}#error{max-width:600px;white-space:pre-wrap}#step-busy{position:fixed;inset:0;background:#f2f0e9dd;z-index:10;place-content:center;text-align:center;font-size:18px;color:#283f3c}#step-busy[data-mode="export"]{inset:auto 24px 100px auto;padding:14px 20px;border:1px solid #d7e2dc;border-radius:12px;background:#fbfcf8;box-shadow:0 3px 16px #28423b12;font-size:15px;pointer-events:none}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0">浏览器需要支持 WebGL 2。</canvas>
<div id="loading"><h1>Forma</h1><p>正在准备模型与测量工具…</p><progress id="progress"></progress><p id="error"></p></div>
<div id="step-busy" hidden></div>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9581492,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
let uploadId = 0;
// STEP processing stays in a local Web Worker; no model is uploaded.
const stepBusy = (active,mode='import') => {const element=document.getElementById('step-busy');element.dataset.mode=mode;element.textContent=mode==='export'?'正在生成并校验 STEP…':'正在本机加载 STEP…';element.hidden=!active;element.style.display=active?'grid':'none';};
const stepRuntime = () => import('./step-wasm/client.min.mjs?v=61a269f800c60d18');
async function loadStepBytes(bytes,name,done) {
  try {
    stepBusy(true);
    const result=await (await stepRuntime()).importStep(bytes,name);
    const prefix='/tmp/mbd-upload-'+(++uploadId)+'/';
    for(const [file,data] of Object.entries(result.files))engine.copyToFS(prefix+file,data);
    done(JSON.stringify({kind:'step_bundle',token:result.token,paths:[prefix+'bundle.json']}));
  } catch(error){done(JSON.stringify({error:String(error)}));} finally {stepBusy(false);}
}
window.MBDWeb = {
  async loadStepSample(done){
    try {stepBusy(true);const response=await fetch('./step-wasm/sample.step');if(!response.ok)throw Error('STEP 示例加载失败');await loadStepBytes(new Uint8Array(await response.arrayBuffer()),'STEP＋PMI 示例.step',done);}catch(error){done(JSON.stringify({error:String(error)}));}finally{stepBusy(false);}
  },
  async importStepBytes(base64,name,done){await loadStepBytes(Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),name,done);},
  async exportStep(payload, token, source, done) {
    // Cached exports complete without a processing overlay or an extra download.
    const pending=setTimeout(()=>stepBusy(true,'export'),350);
    try {
      const result = await (await stepRuntime()).exportStep(JSON.parse(payload),token);
      const download = (data,name,type) => {
        const url=URL.createObjectURL(new Blob([data],{type}));
        const link=document.createElement('a'); link.href=url; link.download=name; document.body.appendChild(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
      };
      download(result.bytes,'forma-annotated.step','application/step');
      done(JSON.stringify(result.report));
    } catch(error) {done(JSON.stringify({error:String(error)}));} finally {clearTimeout(pending);stepBusy(false);}
  },
  pick(kind, done) {
    const input = document.createElement('input');
    input.type = 'file';
    input.hidden = true;
    document.body.appendChild(input);
    input.multiple = kind === 'model';
    input.accept = kind === 'annotation' ? '.json' : '.glb,.gltf,.bin,.png,.jpg,.jpeg,.webp,.step,.stp';
    input.addEventListener('change', async () => {
      try {
        const step = Array.from(input.files).find(file => /\.(step|stp)$/i.test(file.name));
        if (step && kind === 'model') {
          stepBusy(true);
          const result = await (await stepRuntime()).importStep(new Uint8Array(await step.arrayBuffer()),step.name);
          const prefix = '/tmp/mbd-upload-' + (++uploadId) + '/';
          for (const [name,data] of Object.entries(result.files)) engine.copyToFS(prefix+name,data);
          done(JSON.stringify({kind:'step_bundle',token:result.token,paths:[prefix+'bundle.json']}));
          return;
        }
        const paths = [];
        const prefix = '/tmp/mbd-upload-' + (++uploadId) + '/';
        for (const file of input.files) {
          const name = (file.webkitRelativePath || file.name).split('/').filter(x => x && x !== '.' && x !== '..').join('/');
          const path = prefix + name;
          engine.copyToFS(path, await file.arrayBuffer());
          paths.push(path);
        }
        if (paths.length) done(JSON.stringify({kind, paths}));
      } catch (error) { done(JSON.stringify({kind, error: String(error)})); }
      finally { stepBusy(false); input.remove(); }
    }, {once:true});
    input.addEventListener('cancel', () => input.remove(), {once:true});
    input.click();
  }
};
const missing = Engine.getMissingFeatures({threads: false});
const fail = error => {
  document.getElementById('error').textContent = '启动失败：' + String(error) + '\n请使用支持 WebGL 2 的现代浏览器，通过 HTTP(S) 打开。';
  console.error(error);
};
if (missing.length) fail(missing.join(', '));
else engine.startGame({onProgress(current,total){
  const bar = document.getElementById('progress');
  if (total > 0) {bar.max=total;bar.value=current;}
}}).then(() => {
  document.getElementById('loading').remove();
  // Start only after the UI is usable, and respect data-saving/slow networks.
  const connection = navigator.connection;
  if (!connection?.saveData && !['slow-2g','2g'].includes(connection?.effectiveType)) {
    const warm = () => stepRuntime().then(runtime => runtime.warmStepKernel()).catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(warm,{timeout:10000});
    else setTimeout(warm,2000);
  }
}).catch(fail);
</script>
</body>
</html>
